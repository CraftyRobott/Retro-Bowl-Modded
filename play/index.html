<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000"><link rel="manifest" href="./manifest.webmanifest">
<title>Retro Bowl College</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ccc}
body{position:fixed;inset:0}#gm4html5_div_id{position:absolute;inset:0;margin:0;padding:0;border:0}
canvas{image-rendering:pixelated;-webkit-interpolation-mode:nearest-neighbor;touch-action:none;-ms-touch-action:none;margin:0;padding:0;border:0}
#offline-error{position:absolute;z-index:10;inset:0;display:none;place-items:center;background:#101411;color:#f2f4ed;font:14px system-ui;text-align:center;padding:25px;white-space:pre-wrap}
</style></head><body>
<div id="gm4html5_div_id"><img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="" style="display:none">
<canvas id="canvas" width="853" height="480" style="position:absolute;top:50%;left:50%;bottom:-50%;right:-50%;transform:translate(-50%,-50%)"><p>Canvas is not supported.</p></canvas></div>
<div id="offline-error"></div>
<script>
window.PokiSDK={init:()=>Promise.resolve(),gameplayStart:()=>{},gameplayStop:()=>{},happyTime:()=>{},commercialBreak:()=>Promise.resolve(),rewardedBreak:()=>Promise.resolve(false),gameLoadingStart:()=>{},gameLoadingProgress:()=>{},gameLoadingFinished:()=>{},getURLParam:()=>null,setDebug:()=>{}};
window.PokiSDK_OK=true;window.PokiSDK_loadState=2;
</script>
<script>
window.__rbDiagnostics={engineScriptLoaded:false,engineScriptError:null,globalErrors:[]};
window.addEventListener("error",function(event){
 const detail={message:event.message||"Script error",file:event.filename||"",line:event.lineno||0,column:event.colno||0};
 window.__rbDiagnostics.globalErrors.push(detail);
 if(window.__rbDiagnostics.globalErrors.length>5)window.__rbDiagnostics.globalErrors.shift();
 console.error("[Offline diagnostic] JavaScript error:",detail);
},true);
window.addEventListener("unhandledrejection",function(event){
 const reason=event.reason;
 const detail={message:reason&&reason.message?reason.message:String(reason)};
 window.__rbDiagnostics.globalErrors.push(detail);
 console.error("[Offline diagnostic] Unhandled rejection:",detail);
});
</script>
<script src="html5game/RetroBowl.js"
 onload="window.__rbDiagnostics.engineScriptLoaded=true;console.info('[Offline diagnostic] RetroBowl.js loaded; JSON_game:',typeof window.JSON_game,'GameMaker_Init:',typeof window.GameMaker_Init)"
 onerror="window.__rbDiagnostics.engineScriptError='The browser failed to load or execute the RetroBowl.js script element.';console.error('[Offline diagnostic]',window.__rbDiagnostics.engineScriptError)"></script>
<script src="engine/mods/loader.js"></script>
<script>
async function preloadGameMakerTextFiles(){
 // GameMaker reads data files with synchronous XHR. Chrome does not consistently
 // send synchronous XHR through service workers, so seed its own localStorage
 // file layer before GameMaker_Init() runs.
 if(!window.JSON_game||!window.JSON_game.Options){
  const d=window.__rbDiagnostics||{};
  const recent=(d.globalErrors||[]).map(e=>(e.message||"")+" "+(e.file||"")+" line "+(e.line||0)).join(" | ");
  throw Error("Game data configuration is unavailable. Safari diagnostics: RetroBowl.js load event="+String(!!d.engineScriptLoaded)+"; script error="+String(d.engineScriptError||"none")+"; JSON_game="+typeof window.JSON_game+"; GameMaker_Init="+typeof window.GameMaker_Init+"; JavaScript errors="+(recent||"none reported")+".");
 }
 const options=JSON_game.Options;
 const displayName=(options.DisplayName||"").replace(/[^a-zA-Z0-9_]/g,"")||"GameMaker";
 const prefix=displayName+"."+options.gameId+".";
 // GameMaker uses this runtime prefix when resolving localStorage-backed files.
 // Set it explicitly before GameMaker_Init so its first startup reads use the same namespace.
 if(typeof g_pBuiltIn!=="undefined"&&g_pBuiltIn){g_pBuiltIn.game_id=options.gameId;g_pBuiltIn._PN2=prefix;g_pBuiltIn.game_save_id=prefix;}
 const manifestResponse=await fetch("../game-manifest.json");
 if(!manifestResponse.ok)throw Error("Could not read the installed game manifest.");
 const manifest=await manifestResponse.json();
 const textFiles=manifest.files.filter(file=>/^html5game\//i.test(file.path)&&/\.(txt|json|ini|csv|xml)$/i.test(file.path));
 if(!textFiles.some(file=>file.path==="html5game/LanguageUS.txt"))throw Error("The game manifest is missing LanguageUS.txt. Reinstall the game.");
 let loaded=0;
 for(const file of textFiles){
  const url=new URL(file.path,location.href);
  const response=await caches.match(url.href);
  if(!response)throw Error("Offline data file is missing: "+file.path+". Reinstall the game while online.");
  const contents=await response.text();
  try{localStorage.setItem(prefix+file.path.slice("html5game/".length),contents);}
  catch(error){throw Error("Could not prepare game data in browser storage. Free some website storage and reinstall. ("+error.message+")");}
  loaded++;
 }
 const languageKey=prefix+"LanguageUS.txt";
 const languageData=localStorage.getItem(languageKey);
 if(!languageData)throw Error("LanguageUS.txt was downloaded but could not be written to GameMaker storage. Check browser site-storage settings.");
 console.info("[Offline] Prepared "+loaded+" GameMaker text data files. Namespace:",prefix,"LanguageUS bytes:",languageData.length);
}
window.addEventListener("load",async function(){
 const panel=document.getElementById("offline-error");
 try{
  await window.RBModsReady;
  await preloadGameMakerTextFiles();
  if(typeof GameMaker_Init!=="function")throw Error("Game engine did not initialize.");
  GameMaker_Init();
 }catch(error){
  panel.style.display="grid";
  panel.textContent="Could not start the offline game: "+error.message;
 }
});
</script></body></html>
