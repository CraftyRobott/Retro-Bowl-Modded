<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ccc}
body{position:fixed;inset:0}#gm4html5_div_id{position:absolute;inset:0;margin:0;padding:0;border:0}

#rb-main-menu{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);display:block;padding:9px 12px;border:1px solid rgba(255,255,255,.35);border-radius:5px;background:rgba(16,20,17,.88);color:#fff;font:700 11px system-ui,sans-serif;letter-spacing:.06em;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#rb-main-menu:active{background:#344331}

<div id="gm4html5_div_id"><img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="" style="display:none">
<canvas id="canvas" width="853" height="480" style="position:absolute;top:50%;left:50%;bottom:-50%;right:-50%;transform:translate(-50%,-50%)"><p>Canvas is not supported.</p></canvas></div>

<script>
window.__rbSetStatus=function(message){console.info("[Offline diagnostic]",message);};
window.PokiSDK={init:()=>Promise.resolve(),gameplayStart:()=>{},gameplayStop:()=>{},happyTime:()=>{},commercialBreak:()=>Promise.resolve(),rewardedBreak:()=>Promise.resolve(false),gameLoadingStart:()=>{},gameLoadingProgress:()=>{},gameLoadingFinished:()=>{},getURLParam:()=>null,setDebug:()=>{}};
window.PokiSDK_OK=true;window.PokiSDK_loadState=2;
</script>
<script>
window.__rbDiagnostics={engineScriptLoaded:false,engineScriptError:null,globalErrors:[]};
window.addEventListener("error",function(event){
 const detail={message:event.message||"Script error",file:event.filename||"",line:event.lineno||0,column:event.colno||0};
 window.__rbDiagnostics.globalErrors.push(detail);
 if(window.__rbDiagnostics.globalErrors.length>5)window.__rbDiagnostics.globalErrors.shift();
 if(window.__rbSetStatus)window.__rbSetStatus("JavaScript error: "+JSON.stringify(detail)+"\\nJSON_game: "+typeof window.JSON_game+"\\nGameMaker_Init: "+typeof window.GameMaker_Init);
 console.error("[Offline diagnostic] JavaScript error:",detail);
},true);
window.addEventListener("unhandledrejection",function(event){
 const reason=event.reason;
 const detail={message:reason&&reason.message?reason.message:String(reason)};
 window.__rbDiagnostics.globalErrors.push(detail);
 console.error("[Offline diagnostic] Unhandled rejection:",detail);
});
</script>
<script>
window.__rbScriptsReady=(async function(){
 async function readInstalledAsset(path){
  const assetURL=new URL(path,location.href).href;
  const names=(await caches.keys()).filter(name=>name.startsWith("rb-game-install-"));
  for(const name of names){
   const cache=await caches.open(name);
   const response=await cache.match(assetURL);
   if(response)return {cache,response,url:assetURL};
  }
  // Repair a single missing upstream game file in-place instead of forcing
  // the user to download the entire game again.
  if(!names.length)throw Error("No installed game cache was found. Run the installer while online.");
  const cache=await caches.open(names[names.length-1]);
  const upstream="https://raw.githubusercontent.com/ReznorsRevenge1/retro-bowl-college/d5e211826acf4b15d537a1cd84b663ab66714254/"+path;
  let response;
  try{response=await fetch(upstream,{cache:"no-store"});}
  catch(error){throw Error("Installed game asset is missing: "+path+". Connect to Wi-Fi and reopen the game once to repair this file.");}
  if(!response.ok)throw Error("Could not repair missing game asset "+path+" (HTTP "+response.status+"). Reopen while connected to Wi-Fi.");
  const headers=new Headers(response.headers);
  if(path.endsWith(".js"))headers.set("Content-Type","application/javascript; charset=utf-8");
  const repaired=new Response(await response.arrayBuffer(),{status:200,headers});
  await cache.put(assetURL,repaired.clone());
  window.__rbSetStatus("Repaired missing game asset: "+path);
  return {cache,response:repaired,url:assetURL};
 }
 async function loadInstalledScript(path){
  const asset=await readInstalledAsset(path);
  const bytes=await asset.response.arrayBuffer();
  if(path.endsWith("/RetroBowl.js")&&bytes.byteLength<1000000)throw Error("Cached RetroBowl.js is unexpectedly small ("+bytes.byteLength+" bytes).");
  const headers=new Headers(asset.response.headers);
  headers.set("Content-Type","application/javascript; charset=utf-8");
  await asset.cache.put(asset.url,new Response(bytes.slice(0),{status:200,headers}));
  const blobURL=URL.createObjectURL(new Blob([bytes],{type:"application/javascript"}));
  try{
   await new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=blobURL;
    script.onload=resolve;
    script.onerror=()=>reject(Error("Safari could not execute installed script: "+path));
    document.head.appendChild(script);
   });
  }finally{URL.revokeObjectURL(blobURL);}
  return bytes.byteLength;
 }
 window.__rbSetStatus("Loading the installed Poki compatibility extension...");
 const pokiBytes=await loadInstalledScript("html5game/uph_poki.js");
 window.__rbSetStatus("Poki compatibility extension loaded ("+pokiBytes+" bytes).\\nLoading RetroBowl.js...");
 const engineBytes=await loadInstalledScript("html5game/RetroBowl.js");
 window.__rbDiagnostics.engineScriptLoaded=true;
 window.__rbSetStatus("RetroBowl.js loaded ("+engineBytes+" bytes).\\nJSON_game: "+typeof window.JSON_game+"\\nGameMaker_Init: "+typeof window.GameMaker_Init+"\\nPoki init function: "+typeof window.poki_init_raw+"\\nLoading mod loader...");
 await new Promise((resolve,reject)=>{
  const script=document.createElement("script");
  script.src=new URL("engine/mods/loader.js",location.href).href;
  script.onload=resolve;
  script.onerror=()=>reject(Error("Could not load local mod loader."));
  document.head.appendChild(script);
 });
})().catch(error=>{
 window.__rbDiagnostics.engineScriptError=error.message;
 window.__rbSetStatus("Startup script error: "+error.message);
 throw error;
});
</script>
<script>
async function preloadGameMakerTextFiles(){
 // GameMaker reads data files with synchronous XHR. Chrome does not consistently
 // send synchronous XHR through service workers, so seed its own localStorage
 // file layer before GameMaker_Init() runs.
 if(!window.JSON_game||!window.JSON_game.Options){
  const d=window.__rbDiagnostics||{};
  const recent=(d.globalErrors||[]).map(e=>(e.message||"")+" "+(e.file||"")+" line "+(e.line||0)).join(" | ");
  throw Error("Game data configuration is unavailable. Safari diagnostics: RetroBowl.js load event="+String(!!d.engineScriptLoaded)+"; script error="+String(d.engineScriptError||"none")+"; JSON_game="+typeof window.JSON_game+"; GameMaker_Init="+typeof window.GameMaker_Init+"; JavaScript errors="+(recent||"none reported")+".");
 }
 const options=JSON_game.Options;
 const displayName=(options.DisplayName||"").replace(/[^a-zA-Z0-9_]/g,"")||"GameMaker";
 const prefix=displayName+"."+options.gameId+".";
 // GameMaker uses this runtime prefix when resolving localStorage-backed files.
 // Set it explicitly before GameMaker_Init so its first startup reads use the same namespace.
 if(typeof g_pBuiltIn!=="undefined"&&g_pBuiltIn){g_pBuiltIn.game_id=options.gameId;g_pBuiltIn._PN2=prefix;g_pBuiltIn.game_save_id=prefix;}
 const manifestResponse=await fetch("../game-manifest.json");
 if(!manifestResponse.ok)throw Error("Could not read the installed game manifest.");
 const manifest=await manifestResponse.json();
 const textFiles=manifest.files.filter(file=>/^html5game\//i.test(file.path)&&/\.(txt|json|ini|csv|xml)$/i.test(file.path));
 if(!textFiles.some(file=>file.path==="html5game/LanguageUS.txt"))throw Error("The game manifest is missing LanguageUS.txt. Reinstall the game.");
 let loaded=0;
 for(const file of textFiles){
  const url=new URL(file.path,location.href);
  const response=await caches.match(url.href);
  if(!response)throw Error("Offline data file is missing: "+file.path+". Reinstall the game while online.");
  const contents=await response.text();
  try{localStorage.setItem(prefix+file.path.slice("html5game/".length),contents);}
  catch(error){throw Error("Could not prepare game data in browser storage. Free some website storage and reinstall. ("+error.message+")");}
  loaded++;
 }
 const languageKey=prefix+"LanguageUS.txt";
 const languageData=localStorage.getItem(languageKey);
 if(!languageData)throw Error("LanguageUS.txt was downloaded but could not be written to GameMaker storage. Check browser site-storage settings.");
 console.info("[Offline] Prepared "+loaded+" GameMaker text data files. Namespace:",prefix,"LanguageUS bytes:",languageData.length);
}
window.addEventListener("load",async function(){
 const panel=document.getElementById("offline-error");
 try{
  window.__rbSetStatus("Page load event fired.\\nRetroBowl.js load event: "+!!window.__rbDiagnostics.engineScriptLoaded+"\\nJSON_game: "+typeof window.JSON_game+"\\nGameMaker_Init: "+typeof window.GameMaker_Init+"\\nWaiting for mod loader...");
  await window.__rbScriptsReady;
  await window.RBModsReady;
  window.__rbSetStatus("Mod loader ready.\\nPreparing GameMaker data...");
  await preloadGameMakerTextFiles();
  window.__rbSetStatus("GameMaker data prepared.\\nStarting game...");
  if(typeof GameMaker_Init!=="function")throw Error("Game engine did not initialize.");
  GameMaker_Init();
  window.__rbSetStatus("GameMaker_Init called.\\nJSON_game: "+typeof window.JSON_game);
 }catch(error){
  const details="Could not start the offline game: "+error.message;
  panel.style.display="grid";
  panel.textContent=details;
  window.__rbSetStatus(details);
 }
});
</script></body></html>
